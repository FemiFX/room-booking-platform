{% extends "base.html" %}

{% block title %}Booking Confirmation{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body text-center">
        <h1 class="card-title mb-4">Thank You!</h1>
        <p class="card-text">Your inquiry has been successfully sent. We will get back to you shortly.</p>
        <p class="card-text">Your booking number is: <strong>{{ booking_number }}</strong></p>
        <a href="{{ url_for('form') }}" class="btn btn-primary mt-3">Make Another Booking</a>

        {% endblock %}
