{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block extra_css %}
<style>
    .register-container {
        max-width: 500px;
        margin: 5rem auto;
        padding: 0 1rem;
    }
    
    .register-card {
        background-color: rgba(255, 255, 255, 0.03);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .card-header {
        background-color: rgba(85, 153, 255, 0.1);
        padding: 2rem;
        position: relative;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .card-header h2 {
        color: var(--white);
        margin: 0;
        font-size: 1.75rem;
        font-weight: 600;
    }
    
    .card-body {
        padding: 2.5rem;
    }
    
    .auth-icon {
        width: 80px;
        height: 80px;
        background-color: rgba(85, 153, 255, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        color: var(--accent-blue);
    }
    
    .auth-icon i {
        font-size: 2.5rem;
    }
    
    .form-control {
        background-color: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 0.875rem 1.25rem;
        font-size: 1rem;
        color: var(--white);
        transition: all 0.2s ease;
    }
    
    .form-control:focus {
        background-color: rgba(255, 255, 255, 0.05);
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 3px rgba(85, 153, 255, 0.25);
        color: var(--white);
    }
    
    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.3);
    }
    
    .form-label {
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9375rem;
    }
    
    .input-group {
        position: relative;
    }
    
    .input-group-text {
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.7);
    }
    
    .form-text {
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 0.5rem;
    }
    
    .btn-register {
        background-color: var(--accent-blue);
        color: white;
        border: none;
        padding: 0.875rem 0;
        font-weight: 600;
        border-radius: 8px;
        font-size: 1.125rem;
        width: 100%;
        margin-top: 1.5rem;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
    }
    
    .btn-register:hover {
        background-color: #4a8cff;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(85, 153, 255, 0.4);
    }
    
    .register-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9375rem;
        color: rgba(255, 255, 255, 0.5);
    }
    
    .register-footer a {
        color: var(--accent-blue);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s ease;
    }
    
    .register-footer a:hover {
        text-decoration: underline;
    }
    
    .alert-danger {
        background-color: rgba(239, 68, 68, 0.1);
        color: #f56565;
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 8px;
        margin-bottom: 1.5rem;
        padding: 1rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }
    
    .alert-danger i {
        font-size: 1.25rem;
    }
    
    .password-strength {
        margin-top: 0.5rem;
        height: 4px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
    }
    
    .password-strength-bar {
        height: 100%;
        width: 0;
        transition: width 0.3s ease;
        border-radius: 2px;
    }
    
    .strength-weak {
        background-color: #f56565;
    }
    
    .strength-medium {
        background-color: #ed8936;
    }
    
    .strength-strong {
        background-color: #48bb78;
    }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-card">
        <div class="card-header">
            <h2>Create Account</h2>
        </div>
        
        <div class="card-body">
            <div class="auth-icon">
                <i class="fas fa-user-plus"></i>
            </div>
            
            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" id="username" name="username" class="form-control" required placeholder="Enter your username">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input type="email" id="email" name="email" class="form-control" required placeholder="Enter your email address">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="password" name="password" class="form-control" required placeholder="Create a password" oninput="checkPasswordStrength()">
                    </div>
                    <div class="password-strength mt-2">
                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                    </div>
                    <div class="form-text mt-2" id="passwordFeedback">Password must be at least 8 characters long</div>
                </div>
                
                <button type="submit" class="btn-register">
                    <i class="fas fa-user-plus"></i> Register
                </button>
            </form>
            
            <div class="register-footer">
                Already have an account? <a href="{{ url_for('login') }}">Login here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function checkPasswordStrength() {
        const password = document.getElementById('password').value;
        const strengthBar = document.getElementById('passwordStrengthBar');
        const feedback = document.getElementById('passwordFeedback');
        
        // Remove all classes
        strengthBar.classList.remove('strength-weak', 'strength-medium', 'strength-strong');
        
        if (password.length === 0) {
            strengthBar.style.width = '0%';
            feedback.textContent = 'Password must be at least 8 characters long';
            return;
        }
        
        // Calculate strength
        let strength = 0;
        const patterns = [
            /[a-z]/, // lowercase
            /[A-Z]/, // uppercase
            /[0-9]/, // numbers
            /[^a-zA-Z0-9]/ // special characters
        ];
        
        // Add points for length
        if (password.length >= 8) strength += 1;
        if (password.length >= 12) strength += 1;
        
        // Add points for patterns
        patterns.forEach(pattern => {
            if (pattern.test(password)) strength += 1;
        });
        
        // Update UI based on strength
        if (strength < 3) {
            strengthBar.classList.add('strength-weak');
            strengthBar.style.width = '33%';
            feedback.textContent = 'Password is weak';
        } else if (strength < 5) {
            strengthBar.classList.add('strength-medium');
            strengthBar.style.width = '66%';
            feedback.textContent = 'Password is medium strength';
        } else {
            strengthBar.classList.add('strength-strong');
            strengthBar.style.width = '100%';
            feedback.textContent = 'Password is strong';
        }
    }
</script>
{% endblock %}
